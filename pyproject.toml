[project]
name = "vigencia"
version = "0.1.0"
description = "RAG lab over NF-e technical notes during Brazil's consumption tax reform: which rule is in force on a given date."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.15.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "sentence-transformers>=6.1.0",
    "torch>=2.14",
]

[project.scripts]
vigencia = "vigencia.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[build-system]
requires = ["uv_build>=0.11.11,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "PTH",     # pathlib em vez de os.path
    "S",       # bandit (segurança)
    "T20",     # sem print em código de biblioteca
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert é o idioma do pytest

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "network: acessa a internet (portal NF-e etc.)",
    "eval: chama LLM pago ou roda avaliação cara",
    "slow: demora mais que alguns segundos",
    "db: precisa do Postgres do docker compose",
]

# torch do índice do PyTorch com CUDA 12.6: o wheel padrão do PyPI usa CUDA 13, que exige driver NVIDIA >= 580.
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
