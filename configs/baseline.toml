# Baseline ingênuo da fase 1: chunks de tamanho fixo, sem respeitar seção nem tabela, só busca vetorial.
nome = "baseline"

[chunking]
estrategia = "tamanho-fixo"
tamanho = 1500        # caracteres
sobreposicao = 200    # caracteres

[embedding]
modelo = "BAAI/bge-m3"
dimensao = 1024
lote = 16

[busca]
top_k = 5

[geracao]
modelo = "claude-opus-5-5"
esforco = "medium"
max_tokens = 16000
