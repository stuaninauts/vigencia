# Variante do baseline: só o tamanho do chunk muda (sobreposição proporcional, ~13%).
nome = "fixo-3000"

[chunking]
estrategia = "tamanho-fixo"
tamanho = 3000        # caracteres
sobreposicao = 390    # caracteres

[embedding]
modelo = "BAAI/bge-m3"
dimensao = 1024
lote = 16

[busca]
top_k = 5

[geracao]
modelo = "claude-opus-5-5"
esforco = "medium"
max_tokens = 16000
